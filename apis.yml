    name: data.overheid.nl CKAN Action API
    description: >-
      CKAN Action API for data.overheid.nl, a consistent JSON-over-HTTP interface over a catalog of 20,386 datasets. Standard actions include package_search, package_show, package_list, organization_list, group_list, tag_list, and resource_search; datastore_search is available where the DataStore extension is enabled. Base URL https://data.overheid.nl/data/api/3/action/.
