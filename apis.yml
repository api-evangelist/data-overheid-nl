aid: data-overheid-nl
name: data.overheid.nl
description: >-
  data.overheid.nl is a national government open-data portal for Netherlands running CKAN.
  It exposes the CKAN catalog API, a standardized machine-readable interface over approximately 20,386 datasets,
  supporting programmatic dataset search, metadata retrieval, and resource access. Because it runs CKAN, it shares a
  consistent API surface with every other CKAN portal, making it uniformly harvestable and integrable.
